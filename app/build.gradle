plugins {
    id 'com.android.application'
}

android {
    namespace 'com.falcon.ocrtrans'
    compileSdk 35

    defaultConfig {
        applicationId "com.falcon.ocrtrans"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
        vectorDrawables.useSupportLibrary true
    }

    buildFeatures {
        viewBinding true
        // AGP 8 stopped generating BuildConfig by default; the About row reads
        // VERSION_NAME from it.
        buildConfig true
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Model blobs must stay STORED, not DEFLATED: ONNX Runtime maps them
    // straight out of the APK, and a compressed entry forces a full heap copy.
    androidResources {
        noCompress += ['onnx', 'spm', 'vocab', 'bin']
    }

    testOptions {
        unitTests {
            // The JVM tests exercise pure algorithms that merely touch classes
            // with android.graphics types in their signatures; default returns
            // keep those stubs from throwing during class init.
            returnDefaultValues = true
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/*.kotlin_module', 'META-INF/DEPENDENCIES']
        }
    }

    // The bundled MT models push past the 100 MB per-split ceiling, so the
    // debug/release APK is sideload-only. See assets/model/README.md.
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            universalApk true
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.preference:preference:1.2.1'

    def camerax = '1.4.1'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"

    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation "androidx.test.ext:junit:1.3.0"
}
